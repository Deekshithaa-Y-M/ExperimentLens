name: Quality gates

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and quality tools
        run: python -m pip install --upgrade pip && python -m pip install --constraint constraints.txt -e ".[test,lint,api]" build
      - name: Run backend tests
        run: python -m pytest tests -q
      - name: Run lint
        run: python -m ruff check src tests
      - name: Run type checking
        run: python -m mypy src
      - name: Validate package build
        run: python -m build --wheel --sdist
      - name: Verify clean import
        run: python -c "import experimentlens; assert experimentlens.__version__ == '0.1.0'"
      - name: Audit installed dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip install pip-audit && python -m pip_audit --local
