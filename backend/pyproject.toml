[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experimentlens"
version = "0.1.0"
description = "Typed statistical core for ExperimentLens binary experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "fastapi>=0.115"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]
api = ["uvicorn>=0.30"]
lint = ["ruff>=0.6", "mypy>=1.10", "scipy-stubs>=1.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
